name: Build iPadOS 27 PoC

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build unsigned app and hook
        run: |
          chmod +x Scripts/build.sh
          Scripts/build.sh

      - name: Inspect IPA
        run: |
          unzip -l build/LiveIconLab-unsigned.ipa
          plutil -p build/Payload/LiveIconLab.app/Info.plist
          file build/Payload/LiveIconLab.app/LiveIconLab
          file build/LiveIconHook.dylib

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: LiveIconLab-iPadOS27-PoC
          path: |
            build/LiveIconLab-unsigned.ipa
            build/LiveIconHook.dylib
            build/build-manifest.txt
          if-no-files-found: error


  simulator-probe:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show available simulator runtimes
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devices available

      - name: Build SimulatorProbe
        run: |
          set -euxo pipefail
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          mkdir -p build/SimulatorProbe.app
          xcrun --sdk iphonesimulator clang \
            -fobjc-arc \
            -fmodules \
            -isysroot "$SDK" \
            -mios-simulator-version-min=17.0 \
            -framework Foundation \
            -framework UIKit \
            SimulatorProbe/main.m \
            -o build/SimulatorProbe.app/SimulatorProbe
          cp SimulatorProbe/Info.plist build/SimulatorProbe.app/Info.plist

      - name: Boot simulator and run private-framework probe
        run: |
          set -euxo pipefail
          DEVICE="$(xcrun simctl list devices available | awk '/^[[:space:]]*iPad/ { if (match($0, /[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}/)) { print substr($0, RSTART, RLENGTH); exit } }')"
          if [ -z "$DEVICE" ]; then
            DEVICE="$(xcrun simctl list devices available | awk '/^[[:space:]]*iPhone/ { if (match($0, /[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}/)) { print substr($0, RSTART, RLENGTH); exit } }')"
          fi
          test -n "$DEVICE"
          xcrun simctl boot "$DEVICE" || true
          open -a Simulator --args -CurrentDeviceUDID "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/SimulatorProbe.app
          set +e
          xcrun simctl launch --console-pty "$DEVICE" com.goldcreative.liveiconlab.simprobe 2>&1 | tee build/simulator-probe.log
          STATUS="${PIPESTATUS[0]}"
          set -e
          cat build/simulator-probe.log
          exit "$STATUS"

      - name: Upload simulator probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LiveIconLab-SimulatorProbe
          path: build/simulator-probe.log
          if-no-files-found: ignore


  springboard-live-icon-test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build simulator app and SpringBoard hook
        run: |
          set -euxo pipefail
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          ARCH="$(uname -m)"
          case "$ARCH" in
            arm64) TARGET="arm64-apple-ios17.0-simulator" ;;
            x86_64) TARGET="x86_64-apple-ios17.0-simulator" ;;
            *) echo "Unsupported runner arch: $ARCH"; exit 1 ;;
          esac

          rm -rf build/springboard-test
          mkdir -p build/springboard-test/LiveIconLab.app

          xcrun --sdk iphonesimulator clang \
            -fobjc-arc \
            -fmodules \
            -target "$TARGET" \
            -isysroot "$SDK" \
            -framework Foundation \
            -framework UIKit \
            App/main.m \
            -o build/springboard-test/LiveIconLab.app/LiveIconLab

          cp App/Info.plist build/springboard-test/LiveIconLab.app/Info.plist
          python3 Scripts/generate_icons.py build/springboard-test/LiveIconLab.app
          plutil -convert binary1 build/springboard-test/LiveIconLab.app/Info.plist

          xcrun --sdk iphonesimulator clang++ \
            -fobjc-arc \
            -fmodules \
            -target "$TARGET" \
            -isysroot "$SDK" \
            -dynamiclib \
            -framework Foundation \
            SpringBoard/LiveIconHook.mm \
            -Wl,-install_name,/tmp/LiveIconHook-Simulator.dylib \
            -o build/springboard-test/LiveIconHook-Simulator.dylib

          file build/springboard-test/LiveIconLab.app/LiveIconLab
          file build/springboard-test/LiveIconHook-Simulator.dylib

      - name: Boot newest available iPad simulator
        id: sim
        run: |
          set -euxo pipefail
          DEVICE="$(xcrun simctl list devices available | awk '
            /^-- iOS / { section=$0 }
            /^[[:space:]]*iPad/ {
              if (match($0, /[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}/)) {
                last=substr($0, RSTART, RLENGTH)
              }
            }
            END { if (last) print last }
          ')"
          test -n "$DEVICE"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

          xcrun simctl boot "$DEVICE" || true
          open -a Simulator --args -CurrentDeviceUDID "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b

      - name: Inject hook before app installation
        run: |
          set -euxo pipefail
          DEVICE="${{ steps.sim.outputs.device }}"
          DEVICE_ROOT="$HOME/Library/Developer/CoreSimulator/Devices/$DEVICE/data"
          test -d "$DEVICE_ROOT"

          cp build/springboard-test/LiveIconHook-Simulator.dylib \
             "$DEVICE_ROOT/tmp/LiveIconHook-Simulator.dylib"
          chmod 755 "$DEVICE_ROOT/tmp/LiveIconHook-Simulator.dylib"

          xcrun simctl spawn "$DEVICE" launchctl debug system/com.apple.SpringBoard \
            --environment "DYLD_INSERT_LIBRARIES=/tmp/LiveIconHook-Simulator.dylib"

          xcrun simctl spawn "$DEVICE" launchctl stop com.apple.SpringBoard || true
          sleep 8

          xcrun simctl spawn "$DEVICE" launchctl print system/com.apple.SpringBoard \
            > build/springboard-test/launchctl-springboard.txt 2>&1 || true

          xcrun simctl spawn "$DEVICE" log show \
            --style compact --last 1m \
            --predicate 'eventMessage CONTAINS "LiveIconLab"' \
            > build/springboard-test/hook-startup.log 2>&1 || true

          cat build/springboard-test/hook-startup.log

          if ! grep -q 'Hook installed for bundle ID' build/springboard-test/hook-startup.log; then
            echo "Hook did not load into SpringBoard."
            exit 1
          fi

      - name: Install app after hook is active
        run: |
          set -euxo pipefail
          DEVICE="${{ steps.sim.outputs.device }}"

          xcrun simctl uninstall "$DEVICE" com.goldcreative.liveiconlab || true
          sleep 2
          xcrun simctl install "$DEVICE" build/springboard-test/LiveIconLab.app
          sleep 8

          xcrun simctl spawn "$DEVICE" log show \
            --style compact --last 2m \
            --predicate 'eventMessage CONTAINS "LiveIconLab"' \
            > build/springboard-test/liveiconhook.log 2>&1 || true

          cat build/springboard-test/liveiconhook.log

          if ! grep -q 'TARGET selector invoked for com.goldcreative.liveiconlab' \
              build/springboard-test/liveiconhook.log; then
            echo "SBHIconModel did not ask the hook for our target bundle ID."
            exit 1
          fi

          if ! grep -q 'Mapping com.goldcreative.liveiconlab -> SBHClockApplicationIcon' \
              build/springboard-test/liveiconhook.log; then
            echo "Target bundle ID was seen, but mapping to SBHClockApplicationIcon did not occur."
            exit 1
          fi

      - name: Capture two Home Screen frames
        run: |
          set -euxo pipefail
          DEVICE="${{ steps.sim.outputs.device }}"

          xcrun simctl ui "$DEVICE" home || true
          sleep 4
          xcrun simctl io "$DEVICE" screenshot build/springboard-test/home-screen-1.png
          sleep 4
          xcrun simctl io "$DEVICE" screenshot build/springboard-test/home-screen-2.png

          test -s build/springboard-test/home-screen-1.png
          test -s build/springboard-test/home-screen-2.png

          shasum -a 256 \
            build/springboard-test/home-screen-1.png \
            build/springboard-test/home-screen-2.png \
            | tee build/springboard-test/screenshot-hashes.txt

          if cmp -s build/springboard-test/home-screen-1.png \
                    build/springboard-test/home-screen-2.png; then
            echo "WARNING: screenshots are byte-identical; no visible Home Screen animation detected."
            echo "IDENTICAL" > build/springboard-test/frame-comparison.txt
          else
            echo "Screenshots differ. Home Screen changed between frames."
            echo "DIFFERENT" > build/springboard-test/frame-comparison.txt
          fi

      - name: Final SpringBoard diagnostics
        if: always()
        run: |
          DEVICE="${{ steps.sim.outputs.device }}"
          xcrun simctl spawn "$DEVICE" log show \
            --style compact --last 5m \
            --predicate 'eventMessage CONTAINS "LiveIconLab"' \
            > build/springboard-test/liveiconhook-final.log 2>&1 || true
          grep '\[LiveIconLab\]' build/springboard-test/liveiconhook-final.log || true

      - name: Upload SpringBoard live-icon test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LiveIconLab-SpringBoard-LiveIcon-Test
          path: |
            build/springboard-test/home-screen-1.png
            build/springboard-test/home-screen-2.png
            build/springboard-test/screenshot-hashes.txt
            build/springboard-test/frame-comparison.txt
            build/springboard-test/hook-startup.log
            build/springboard-test/liveiconhook.log
            build/springboard-test/liveiconhook-final.log
            build/springboard-test/launchctl-springboard.txt
            build/springboard-test/LiveIconHook-Simulator.dylib
          if-no-files-found: warn
